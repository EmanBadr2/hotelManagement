
<div class=" px-5">
  <div class="p-4">
    <h2  class="text-xl font-bold "> {{ !activeRoomID? 'Add' : isFormDisabled?'View' : 'Edit' }} Room </h2>
  </div>
  <form
    class=""
    [formGroup]="addRoomForm"
    (ngSubmit)="Submit(addRoomForm)"
  >
    <div class=" ">
      <app-auth-inputs
        formControlName="roomNumber"
        label="Room Number"
        placeholder="Please type here"
        id="roomNumber"
      ></app-auth-inputs>
      <div
        *ngIf="
          addRoomForm.get('roomNumber')?.touched &&
          addRoomForm.get('roomNumber')?.errors
        "
        class="text-red-500 text-sm mt-1"
      >
        Room Number is required.
      </div>
    </div>


    <div class="grid grid-cols-2 gap-4 ">
      <div>
        <app-auth-inputs
          formControlName="price"
          label="Price"
          placeholder="Please type here"
          id="price"
        ></app-auth-inputs>
        <div
          *ngIf="
            addRoomForm.get('price')?.touched &&
            addRoomForm.get('price')?.errors
          "
          class="text-red-500 text-sm mt-1"
        >
          Phone Number is required.
        </div>
      </div>

      <div>
        <app-auth-inputs
          formControlName="capacity"
          label="capacity"
          placeholder="Please type here"
          id="capacity"
        ></app-auth-inputs>
        <div
          *ngIf="
            addRoomForm.get('capacity')?.touched &&
            addRoomForm.get('capacity')?.errors
          "
          class="text-red-500 text-sm mt-1"
        >
          Country is required.
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 ">
      <div>
        <app-auth-inputs
          formControlName="discount"
          label="discount"
          placeholder="Please type here"
          id="discount"
        ></app-auth-inputs>
        <div
          *ngIf="
            addRoomForm.get('discount')?.touched &&
            addRoomForm.get('discount')?.errors
          "
          class="text-red-500 text-sm mt-1"
        >
          Phone Number is required.
        </div>
      </div>




     <!-- Facilities Dropdown -->

  <div>
    <!-- <label class="block text-sm font-medium">Facilities</label> -->

    <p-multiSelect
      [options]="facilities"
      optionLabel="name"
      formControlName="facilities"
      display="chip"
      class="w-full mt-1"
      placeholder="Select facilities">
    </p-multiSelect>
  </div>


    </div>


    <ngx-dropzone
    class="bg-green-200"
     (change)="onSelect($event)"  [disabled]="isViewMode">
      <ngx-dropzone-label>Drop Your Photo !</ngx-dropzone-label>
      <ngx-dropzone-preview
        *ngFor="let f of files"
        [removable]="true"
        (removed)="onRemove(f)"
      >
        <ngx-dropzone-label 
          >{{ f.name }} ({{ f.type }})</ngx-dropzone-label
        >
      </ngx-dropzone-preview>
    </ngx-dropzone>



    <div class="flex justify-end space-x-4">
      <button *ngIf="!isViewMode" type="submit"
      class="px-6 py-2 bg-blue-600
       text-white rounded-lg hover:bg-blue-700 transition"
      >{{!activeRoomID? 'Add' : 'update'}}</button>

      <button type="button"
      routerLink="/admin/rooms/rooms"
      class="px-6 py-2 border border-blue-500
       text-blue-500 rounded-lg hover:bg-blue-50 transition"
      >cancel</button>
    </div>

  </form>
</div>
