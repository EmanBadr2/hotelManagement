<div class="p-4 text-center">
  <div class="d-flex justify-content-center mb-2">
    <img
      class="w-[10rem] h-[10rem]"
      src="../../../../assets/img/key.png"
      alt="auth-key"

    />
  </div>
  <p class="text-gray-700 font-bold text-[1rem]">
    {{ resourcePath + "title" | translate }}
  </p>
</div>

<div class="flex justify-center gap-4 px-4 pb-2">
  <button
    [routerLink]="['/auth/register']"
    pButton
    [label]="resourcePath + 'register' | translate"
    class="p-button-secondary"
  ></button>

  <button
    pButton
    [label]="resourcePath + 'login' | translate"
    [routerLink]="['/auth/login']"
    class="text-white px-4 py-2 rounded"
    style="background-color: #FF498B;"
  ></button>
</div>
