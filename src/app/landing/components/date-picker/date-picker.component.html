
<section class="container p-3 h-[25vh] ">
  <div class=" grid sm:grid-cols-2  justify-center items-center ">

    <div class="rigt-side">
      <h2 class="h2-content ">Forget Busy Work, Start Next Vacation</h2>
      <p class="p-content ">We provide what you need to enjoy your holiday with family.
         Time to make another memorable moments.
       </p>

       <div class="start-booking">
        <h6 class="text-landingContent-h2 text-xl font-medium">Start Booking</h6>
             <!--    [iconDisplay]="'input'" -->
         <!-- date picker -->
        <div class="mt-3 w-full">
              <span for="icondisplay" class="span-content block mb-2">Pick a Date </span>
              <p-calendar class=" "
                  [(ngModel)]="date"
                  [showIcon]="true"
                  [icon]="'pi pi-calendar-minus'"
                  inputId="icondisplay" />
       </div>
         <!-- capacity -->
         <div class="my-3 ">
          <span class="span-content block mb-1">Capacity </span>
          <div class="capacity">
           <button class="bg-[#E74C3C] main-btn capacity-btn" [disabled]="capacity == 0"
           (click)="removeCapacity()">
             <i class="pi pi-minus font-bold text-lg"></i>
            </button>
           <span class="span-content ">{{capacity}} Person </span>
            <button class="bg-[#1ABC9C] main-btn capacity-btn" (click)="addCapacity()">
              <i class="pi pi-plus font-bold text-lg"></i>
            </button>
          </div>

         </div>
         <!-- Explore -->
        <div class="w-1/2 mt-10">
          <button
           class="w-full bg-[#3252DF] main-btn py-2 px-4 span-content text-white "
          (click)="explore()"
           [disabled]="capacity==0 || date == undefined"
           >Explore</button>
        </div>

       </div>
    </div>

    <div class="left-side p-2">
      <!--  class="h-full w-auto object-contain" -->
      <img src="../assets/img/banner.png" alt="" class="w-full  object-cover">
    </div>

  </div>
</section>
