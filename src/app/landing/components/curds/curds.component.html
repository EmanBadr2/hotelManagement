<div class=" pt-5">
    <h1 class="text-3xl font-bold mb-6">Most popular ads</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 auto-rows-[250px]">

      <div *ngIf="rooms.length > 0" class="card-wrapper row-span-2">
        <img
          [src]="rooms[0].images[0] || '/assets/img/Rectangle 3.png'"
          alt="Room Image"
          class="card-img"
        />
        <div class="card-body">
          <p class="font-semibold">${{ rooms[0].price }} per night</p>
        </div>
        <div class="card-footer">
          <h2 class="text-xl font-bold">Stark House</h2>
          <p class="text-sm">Malang, Indonesia</p>
        </div>
        <div class="overlay">
            <div class="icon-container">
                <i class="fas fa-heart"></i>
                <i class="fas fa-eye"></i>
            </div>
        </div>
      </div>
      <ng-container *ngFor="let room of rooms.slice(1, 5)">
        <div class="card-wrapper">
          <img
            [src]="room.images[0] || '/assets/img/Rectangle 3.png'"
            alt="Room Image"
            class="card-img"
          />
          <div class="card-body">
            <p class="font-semibold">${{ room.price }} per night</p>
          </div>
          <div class="">
            <h2 class="text-lg font-bold">Stark House</h2>
            <p class="text-sm">Malang, Indonesia</p>
          </div>
          <div class="overlay">
            <div class="icon-container">
                <i class="fas fa-heart"></i>
                <i class="fas fa-eye"></i>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
</div>
<section>
  <div class="pt-5">
    <h1 class="text-3xl font-bold mb-6">Ads</h1>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 auto-rows-[250px]">
          <ng-container *ngFor="let room of rooms.slice(5,9)">
            <div class="flex flex-col overflow-hidden">
              <div class="card-wrapper">
                <img
                  [src]="room.images[0] || '/assets/img/Rectangle 3.png'"
                  alt="ads Image"
                  class="card-img"
                />
                <div class="card-body">
                    <p class="font-semibold">{{ room.discount }}% Off</p>
                  </div>
                <div class="overlay">
                    <div class="icon-container">
                      <i class="fas fa-heart"></i>
                      <i class="fas fa-eye"></i>
                    </div>
                    <div class="absolute bottom-2 right-2 flex flex-wrap gap-1">
                      <ng-container *ngFor="let fId of room.facilities">
                        <ng-container *ngIf="facilityMap[fId] as fac">
                          <span
                            class="flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-medium shadow-sm"
                            [ngClass]="[fac.bg, fac.text]"
                            style="line-height: 1;"
                          >
                            <i [class]="fac.icon" class="text-[12px]"></i>
                            {{ fac.name }}
                          </span>
                        </ng-container>
                      </ng-container>
                    </div>
                </div>
              </div>
              <div class="card-footer px-2 py-2 text-start">
                <h2 class="text-xl">{{ room.roomNumber }}</h2>
                <!-- <p class="text-sm text-gray-500">Posted by:{{ facilities.name }}</p> -->
              </div>
            </div>
          </ng-container>
    </div>
</div>
