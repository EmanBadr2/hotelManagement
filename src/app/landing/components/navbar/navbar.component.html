<section
  class="landing_navbar relative flex flex-col items-center justify-center z-50 p-3"
>
  <div class="container">
    <div class="flex justify-between items-center">
      <!-- Logo -->
      <div class="logo">
        <img src="../../../../assets/img/Staycation..png" alt="logo" />
      </div>

      <!-- Burger Icon for Small Screens -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" class="">
          <i class="pi pi-bars text-3xl text-blue-500"></i>
        </button>
      </div>

      <!-- Desktop Menu -->
      <div class="landing_navbar__list hidden md:block">
        <ul class="flex items-center">
          <ng-container *ngTemplateOutlet="menuItems"></ng-container>
        </ul>
      </div>
    </div>
  </div>

  <!-- Dropdown Mobile Menu -->
  <div
    class="absolute top-12 left-0 w-full bg-white shadow-md p-4 md:hidden z-40"
    *ngIf="menuOpen"
  >
    <ul class="flex flex-col items-start gap-4">
      <ng-container *ngTemplateOutlet="menuItems"></ng-container>
    </ul>
  </div>

  <!-- Template for List Items (Shared by Desktop and Mobile) -->
  <ng-template #menuItems>
    <li
      class="landing_navbar__list__list-item"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <a routerLink="/">Home</a>
    </li>

    <li class="landing_navbar__list__list-item" routerLinkActive="active">
      <a routerLink="/explore">Explore</a>
    </li>

    <li
      class="landing_navbar__list__list-item"
      *ngIf="isUserLoggedIn"
      routerLinkActive="active"
    >
      <a routerLink="/booking">Reviews</a>
    </li>

    <li
      class="landing_navbar__list__list-item"
      *ngIf="isUserLoggedIn"
      routerLinkActive="active"
    >
      <a routerLink="/fav-items">Favorites</a>
    </li>

    <li
      class="landing_navbar__list__list-item flex gap-2 items-center"
      *ngIf="isUserLoggedIn"
    >
      <img src="../../../../assets/img/profile.png" alt="Upskilling" />
      <h5>{{ userName }}</h5>
    </li>

    <li
      class="landing_navbar__list__list-item w-full md:w-auto"
      *ngIf="!isUserLoggedIn"
      routerLinkActive="active"
    >
      <a routerLink="/auth/register"
        ><button class="nav_btn w-full">Register</button></a
      >
    </li>

    <li
      class="landing_navbar__list__list-item w-full md:w-auto"
      *ngIf="!isUserLoggedIn"
      routerLinkActive="active"
    >
      <a routerLink="/auth"
        ><button class="nav_btn w-full">Login Now</button></a
      >
    </li>
  </ng-template>
</section>
