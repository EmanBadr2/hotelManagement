<div class="w-full mx-auto grid sm:grid-cols-1  md:grid-cols-2 gap-8 p-5 border rounded   " >
  <div class=" rate relative w-full p-3">
   <p class=" span-content"> Rate </p>
   <p-rating [cancel]="false" [(ngModel)]="rating" />

   <div>
     <p class=" span-content pt-3 pb-1"> Message </p>
     <textarea  [(ngModel)]="review"
     class="text-area-style" rows="4" placeholder="Write your message..."></textarea>
   </div>
   <button (click)="createReview()" [disabled]="!rating && !review"
   class="pageDetails-btn ">Rate</button>
  </div>

  <div  class="flex flex-col space-y-4">
   <p class=" span-content mb-6"> Add Your Comment </p>
   <div>
     <p class=" span-content pt-3 pb-1"> Message </p>
     <textarea   [(ngModel)]="comment"
      class="text-area-style" rows="4" placeholder="Write your message..."></textarea>
   </div>
   <button (click)="createComment()" [disabled]="!comment"
    class="pageDetails-btn ">Send</button>
  </div>
  </div>
  <!-- ------------ -->
   <!-- show all comment && Review  -->
   

  <div class="py-5 my-5 w-full mx-auto grid sm:grid-cols-1  md:grid-cols-2 gap-8 p-5 border rounded  ">

    <!-- review -->
   <div class="">
    <p class=" text-xl font-bold text-landingContent-h2 pt-3 pb-1">All Reviews </p>
    <div class=" p-4 my-3 border shadow-sm rounded-md" *ngFor="let review of roomReviews">
      <p-rating [cancel]="false" [(ngModel)]="review.rating" />
      <p class=" text-landingContent-h2 text-2xl   "> {{review.review}}</p>
      <p class="text-sm pt-3 w-1/2"> Create By : <span class=" p-content">{{review.user.userName}}</span> </p>
    </div>
   </div>

   <!-- comment -->
    <div class="">
      <p class=" text-xl font-bold text-landingContent-h2 pt-3 pb-1">All Comments </p>
      <div class=" p-4 my-3 border shadow-sm rounded-md" *ngFor="let comment of roomComments">
        <p class=" text-landingContent-h2 text-2xl   "> {{comment.comment}}</p>
        <p class="text-sm pt-3 w-1/2"> Create By : <span class=" p-content">{{comment.user.userName}}</span> </p>
        <div class="flex justify-between items-center p-2"
        *ngIf="comment.user._id == userID || comment.user.userName == userName ">
          <button (click)="updateComment(comment._id)" [disabled]=""
          class="main-btn p-2 bg-yellow-300 w-1/3">Update</button>
          <button (click)="deleteComment(comment._id)" [disabled]=""
          class="main-btn p-2 bg-red-700 w-1/3">Delete</button>
        </div>
      </div>
    </div>

  </div>
