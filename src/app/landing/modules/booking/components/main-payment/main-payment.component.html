<div class="h-screen flex flex-col items-center px-4 py-4 overflow-hidden">
  <!-- Step Indicator -->

  <p-steps
    [model]="steps"
    [(activeIndex)]="activeIndex"
    [readonly]="true"
    class="mb-6"
  ></p-steps>
  <div
    *ngIf="activeIndex === 0 || activeIndex === 1"
    class="w-full max-w-6xl flex flex-col flex-grow overflow-hidden"
  >
    <!-- Header -->
    <div class="text-center mb-4">
      <h2 class="text-3xl font-bold text-gray-800 mb-1">Payment</h2>
      <p class="text-gray-600">Kindly follow the instructions below</p>
    </div>
    <!-- Main Flex Layout -->
    <div class="flex-grow flex gap-6 overflow-hidden">
      <!-- Left Side -->
      <div
        class="w-1/2 flex flex-col justify-between text-sm text-gray-700 p-4 overflow-auto"
      >
        <h2 class="text-lg font-semibold text-gray-800">
          Transfer Pembayaran:
        </h2>
        <div>
          <p><strong>Tax:</strong> 10%</p>
          <p><strong>Subtotal:</strong> $480 USD</p>
          <p><strong>Total:</strong> $580 USD</p>
        </div>
        <div class="space-y-4">
          <div class="flex items-start space-x-4">
            <img src="/assets/img/bca.png" class="w-20" alt="BCA" />
            <div>
              <p class="font-semibold">Bank Central Asia</p>
              <p>2208 1996</p>
              <p>BuildWith Angga</p>
            </div>
          </div>
          <div class="flex items-start space-x-4">
            <img src="/assets/img/mandiri.png" class="w-20" alt="Mandiri" />
            <div>
              <p class="font-semibold">Bank Mandiri</p>
              <p>2208 1996</p>
              <p>BuildWith Angga</p>
            </div>
          </div>
        </div>
      </div>
      <!-- Divider -->
      <div class="w-px bg-gray-300"></div>
      <!-- Right Side -->
      <div class="w-50">
        <app-payment
          (nextStep)="goNext()"
        ></app-payment>
      </div>
    </div>
    <div class="flex justify-center pt-4">
      <button
        pButton
        label="Continue to Book"
        [disabled]="activeIndex === 0"
        class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700"
        (click)="payBooking()"
      ></button>
    </div>
  </div>
  <div *ngIf="activeIndex === 2">
    <app-completed></app-completed>
  </div>
</div>
