<div class="flex justify-center items-center px-4 py-10">
  <div class="w-full max-w-lg">
    <form [formGroup]="checkoutForm" class="space-y-5">

      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700" for="name">Name</label>
        <input
          id="name"
          pInputText
          formControlName="name"
          class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300"
          placeholder="Full Name"
        />
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700" for="email">Email</label>
        <input
          id="email"
          pInputText
          type="email"
          formControlName="email"
          class="w-full p-2 border border-gray-300 rounded-md focus:ring focus:ring-blue-300"
          placeholder="example@email.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Card Details</label>
        <div class="border border-gray-300 p-4 rounded-md">
          <ngx-stripe-elements [stripe]="stripe" [elementsOptions]="elementsOptions">
            <ngx-stripe-card [options]="cardOptions"></ngx-stripe-card>
          </ngx-stripe-elements>
        </div>
      </div>

      <div class="flex justify-between pt-4">
        <button
          pButton
          label="Generate Token"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 w-1/2"
          (click)="createToken()"
        ></button>

        <button
          pButton
          label="Pay"
          class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 w-1/2"
          (click)="payBooking()"
        ></button>
      </div>
      
    </form>
  </div>
</div>
